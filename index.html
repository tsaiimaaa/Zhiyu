<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智宇系統_巡點服務管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--sur:#ffffff;--sur2:#f0f1f5;--bdr:#dde1ec;--acc:#4f7cff;--acc2:#00d4aa;--warn:#ff9f43;--err:#ff4d6d;--ok:#2ecc71;--txt:#1a1d2e;--dim:#6b7290;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px}
.hdr{background:#fff;border-bottom:1px solid var(--bdr);box-shadow:0 1px 4px rgba(0,0,0,.06);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.hdr h1{font-size:16px;font-weight:700}
.hdr-pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#eef0f7;border:1px solid var(--bdr);border-radius:20px;padding:4px 12px;font-size:11px;display:flex;align-items:center;gap:5px}
.pill b{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--acc)}
.wrap{display:flex;height:calc(100vh - 56px)}
.sb{width:185px;background:var(--sur);border-right:1px solid var(--bdr);flex-shrink:0;overflow-y:auto;transition:transform .25s,width .25s;z-index:100}
.sb.hide{transform:translateX(-100%);width:0;overflow:hidden}
.sb-lbl{font-size:10px;letter-spacing:1.5px;color:var(--dim);padding:10px 14px 4px;text-transform:uppercase}
.sb-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;width:100%;border:none;background:none;color:var(--dim);font-family:inherit;font-size:13px;text-align:left;cursor:pointer;border-left:3px solid transparent;transition:.15s}
.sb-btn:hover{background:var(--sur2);color:var(--txt)}
.sb-btn.on{background:rgba(79,124,255,.08);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.sb-btn .ct{margin-left:auto;background:var(--sur2);border-radius:10px;padding:1px 7px;font-size:11px;font-family:'JetBrains Mono',monospace}
.sb-btn.on .ct{background:rgba(79,124,255,.2);color:var(--acc)}
.ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
.ovl.show{display:block}
.tog{position:fixed;top:64px;left:10px;z-index:150;width:32px;height:32px;border-radius:7px;background:#fff;border:1px solid var(--bdr);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tog:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.tog.open{left:195px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tbar{background:var(--sur);border-bottom:1px solid var(--bdr);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{position:relative;flex:1;min-width:150px}
.sw-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none;font-size:13px}
.si{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:7px 12px 7px 32px;color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.si:focus{border-color:var(--acc)}
select.fi{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:7px 10px;color:var(--txt);font-family:inherit;font-size:12px;outline:none;cursor:pointer}
.btn{padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:#3d6be0}
.btn-o{background:transparent;border:1px solid var(--bdr);color:var(--dim)}.btn-o:hover{border-color:var(--acc);color:var(--acc)}
.tw{flex:1;overflow:auto;padding:14px 16px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:var(--sur2);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;padding:9px 10px;text-align:left;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:10;white-space:nowrap;cursor:pointer}
th:hover{color:var(--txt)}
tr{border-bottom:1px solid rgba(221,225,236,.6)}
tr:hover{background:rgba(79,124,255,.03)}
tr:hover .c2{background:rgba(237,241,255,.9)}
td{padding:9px 10px;vertical-align:middle;font-size:13px}
.mn{font-family:'JetBrains Mono',monospace;font-size:11px}
.c0{width:36px}.c1{width:65px}.c2{width:140px;position:sticky;left:0;background:#fff;z-index:5;box-shadow:2px 0 6px rgba(0,0,0,.04)}.c3{display:none}.c4{width:48px;text-align:center}.c5{width:140px}.c6{width:105px}.c8{width:105px}.c9{width:105px}.c10{width:72px}.c11{width:150px}.c12{width:62px;text-align:center}
.bds{display:inline-flex;align-items:center;gap:3px;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.bd-ok{background:rgba(46,204,113,.15);color:#27ae60}
.bd-fix{background:rgba(255,77,109,.15);color:#e74c3c}
.bd-pend{background:rgba(255,159,67,.15);color:#e67e22}
.bd-nil{background:rgba(107,114,144,.12);color:var(--dim)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbtn{background:none;border:none;cursor:pointer;padding:0;display:block;width:100%}
.stbtn:hover{opacity:.8}
.dc{cursor:pointer}
.dc:hover .de-ico{opacity:1}
.dd{display:flex;align-items:center;gap:3px;min-height:18px}
.de-ico{opacity:0;font-size:10px;color:var(--acc);transition:.15s}
.id{background:var(--sur2);border:1px solid var(--acc);border-radius:5px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 5px;width:115px;outline:none;cursor:pointer}
.id::-webkit-calendar-picker-indicator{filter:none;cursor:pointer}
.id-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;font-size:16px}
.id-native::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dph{font-size:11px;color:#aab0c8;font-style:italic}
.abtns{display:flex;gap:3px;justify-content:center}
.ib{width:26px;height:26px;border-radius:5px;border:1px solid var(--bdr);background:var(--sur2);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.ib:hover{border-color:var(--acc);color:var(--txt)}
.ib.del:hover{border-color:var(--err);color:var(--err)}
.empty{text-align:center;padding:50px;color:var(--dim)}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.mo.show{display:flex}
.md{background:#fff;border:1px solid var(--bdr);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.12);width:600px;max-width:95vw;max-height:90vh;overflow-y:auto}
.mh{padding:18px 22px 12px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
.mh h2{font-size:15px;font-weight:700}
.mc{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.mb{padding:18px 22px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg-full{grid-column:1/-1}
.fl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:4px;display:block}
.fi2{background:var(--sur2);border:1px solid var(--bdr);border-radius:7px;padding:8px 10px;color:var(--txt);font-family:inherit;font-size:13px;outline:none;width:100%}
.fi2:focus{border-color:var(--acc)}
.mf{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--bdr)}
.tc{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{background:#fff;border:1px solid var(--bdr);box-shadow:0 4px 16px rgba(0,0,0,.1);border-left:3px solid var(--ok);border-radius:7px;padding:9px 14px;font-size:13px;animation:sli .2s ease}
.toast.err{border-left-color:var(--err)}
@keyframes sli{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
.rcard{background:#fff;border:1px solid #dde1ec;border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.rh{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bdr)}
.rh:hover{background:var(--sur2)}
.rci{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ri{flex:1;min-width:0}
.rt{font-size:13px;font-weight:700}
.rs{font-size:11px;color:var(--dim);margin-top:1px}
.rb{display:none}
.rb.op{display:block}
.rhs{display:flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(79,124,255,.04);font-size:12px;color:var(--dim);border-bottom:1px solid var(--bdr)}
.rhd{width:9px;height:9px;border-radius:50%;background:var(--acc);flex-shrink:0}
.rsp{display:flex;align-items:flex-start;gap:9px;padding:9px 14px;border-bottom:1px solid rgba(221,225,236,.5)}
.rsp:last-child{border-bottom:none}
.rsp:hover{background:rgba(79,124,255,.03)}
.rsl{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding-top:2px}
.rdt{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rvl{width:1.5px;flex:1;min-height:24px;background:var(--bdr);margin-top:2px}
.rsp:last-child .rvl{display:none}
.rsb{flex:1;min-width:0}
.rsn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsa{font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsm{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rbg{font-size:10px;padding:2px 5px;border-radius:3px;font-weight:600}
.rbg-r{background:rgba(79,124,255,.12);color:var(--acc)}
.rbg-m{background:var(--sur2);color:var(--dim)}
.rbg-t{background:rgba(0,212,170,.12);color:#0F6E56}
.rnb{font-size:11px;padding:3px 9px;border-radius:7px;border:1px solid #1D9E75;color:#0F6E56;background:transparent;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0}
.rnb:hover{background:rgba(29,158,117,.1)}
.rtb{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--bdr);background:transparent;color:var(--dim);cursor:pointer}
.rtb.on{background:rgba(79,124,255,.12);color:var(--acc);border-color:var(--acc)}
.rstat{background:#eef0f7;border-radius:7px;padding:9px 11px}
.rsl2{font-size:11px;color:var(--dim);margin-bottom:2px}
.rsv{font-size:19px;font-weight:700}
.rchv{font-size:12px;color:var(--dim);flex-shrink:0;transition:transform .15s}
.rma{font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid var(--bdr);color:var(--dim);background:transparent;text-decoration:none;display:inline-flex;align-items:center;flex-shrink:0;margin-top:1px}
.rma:hover{border-color:var(--acc2);color:var(--acc2)}
#locateBtn:disabled{opacity:.6;cursor:wait}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#locateBtn:disabled{animation:pulse 1s infinite}
#saveindicator{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px;flex-shrink:0}
.cust-item{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid rgba(221,225,236,.5);cursor:pointer;transition:.1s}
.cust-item:hover{background:rgba(79,124,255,.04)}
.cust-item.selected{background:rgba(79,124,255,.07)}
.cust-cb{width:16px;height:16px;border-radius:4px;border:2px solid var(--bdr);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:.15s}
.cust-item.selected .cust-cb{background:var(--acc);border-color:var(--acc);color:#fff}
.cust-tag{font-size:10px;padding:2px 6px;border-radius:10px;background:rgba(79,124,255,.1);color:var(--acc);font-weight:600;flex-shrink:0}
.sel-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(79,124,255,.12);color:var(--acc);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer}
.sel-chip:hover{background:rgba(255,77,109,.12);color:var(--err)}
@media(max-width:700px){.sb{position:fixed;top:56px;left:0;height:calc(100vh - 56px)}.sb.hide{transform:translateX(-185px);width:185px}.tog.open{left:195px}.c3{display:none}.c5{width:90px}.c6{width:70px}.c8{width:70px}.c9{width:70px}.c10{width:58px}.c11{display:none}.c4{width:40px}}
@media(max-width:480px){.c5{display:none}.hdr-pills{display:none}}
</style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="hdr">
  <div class="hdr-l">
    <div class="logo">🖨️</div>
    <h1>智宇系統_巡點服務管理</h1>
  </div>
  <div class="hdr-pills" id="pills"></div>
  <div id="saveindicator"></div>
</div>
<div class="ovl" id="ovl" onclick="toggleSB()"></div>
<button class="tog open" id="tog" onclick="toggleSB()">☰</button>
<div class="wrap">
  <nav class="sb" id="sb">
    <div class="sb-lbl">功能</div>
    <button class="sb-btn" id="routeBtn" onclick="showView('route')">🗺 路線規劃</button>
    <div class="sb-lbl" style="margin-top:6px">月份紀錄</div>
    <div id="mnav"></div>
  </nav>
  <div class="main" id="recView">
    <div class="tbar">
      <div class="sw">
        <span class="sw-ico">🔍</span>
        <input class="si" id="srch" placeholder="搜尋客戶、地址、型號…" oninput="onSearch(this.value)">
      </div>
      <select class="fi" id="rgFil" onchange="onFilter()"><option value="">全部區域</option></select>
      <select class="fi" id="stFil" onchange="onFilter()">
        <option value="">全部狀態</option>
        <option value="已完成">✅ 已完成</option>
        <option value="待維修">🔧 待維修</option>
        <option value="未完成">⚠️ 未完成</option>
      </select>
      <button class="btn btn-p" onclick="openAdd()">＋ 新增</button>
      <button class="btn btn-o" onclick="doExport()">⬇ 匯出</button>
      <button class="btn btn-o" onclick="clearStorage()" title="清除本機儲存">🗑 重置</button>
    </div>
    <div class="tw">
      <table>
        <thead><tr>
          <th class="c0">#</th>
          <th class="c1" onclick="doSort('region')">區域</th>
          <th class="c2" onclick="doSort('name')">客戶名稱</th>
          <th class="c4">台數</th>
          <th class="c5">機器型號</th>
          <th class="c12">操作</th>
          <th class="c6" onclick="doSort('date1')">第一次巡點</th>
          <th class="c8">第二次巡點</th>
          <th class="c9">第三次巡點</th>
          <th class="c10" onclick="doSort('status')">狀態</th>
          <th class="c11">備註</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">📋 查無資料</div>
    </div>
  </div>
  <div class="main" id="routeView" style="display:none">
    <div class="tbar" style="gap:10px">
      <span style="font-size:14px;font-weight:700">🗺 巡點路線規劃</span>
      <div id="locationBar" style="font-size:11px;color:var(--dim);flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span id="locationText">📍 出發：左營博愛三路520號（預設）</span>
        <button class="btn btn-o" id="locateBtn" onclick="locateMe()" style="font-size:11px;padding:3px 10px;white-space:nowrap">🎯 定位我的位置</button>
      </div>
      <div id="rtabs" style="display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;flex-shrink:0;max-width:100%"></div>
      <button class="btn btn-p" onclick="showCustomPlanner()" style="font-size:12px;padding:5px 12px;white-space:nowrap">＋ 自訂行程</button>
    </div>
    <div style="padding:12px 16px;flex:1;overflow:auto">
      <!-- 自訂行程面板 -->
      <div id="customPanel" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4)" onclick="if(event.target===this)hideCustomPlanner()">
        <div style="position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;max-height:90vh;display:flex;flex-direction:column">
          <!-- 標題列 -->
          <div style="padding:14px 16px 10px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;flex-shrink:0">
            <span style="font-size:15px;font-weight:700;flex:1">📋 自訂今日行程</span>
            <span id="custCount" style="font-size:12px;color:var(--acc);font-weight:600"></span>
            <button onclick="hideCustomPlanner()" style="background:none;border:none;font-size:20px;color:var(--dim);cursor:pointer;padding:0 4px">✕</button>
          </div>
          <!-- 搜尋 -->
          <div style="padding:10px 16px;flex-shrink:0;border-bottom:1px solid var(--bdr)">
            <input id="custSearch" style="width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:9px 14px;font-family:inherit;font-size:14px;outline:none;color:var(--txt)" placeholder="搜尋客戶名稱或區域…" oninput="renderCustomList(this.value)">
          </div>
          <!-- 已選標籤 -->
          <div id="selectedList" style="padding:8px 16px;min-height:38px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bdr);background:#f8f9fc;flex-shrink:0">
            <span id="selectedEmpty" style="font-size:12px;color:var(--dim);padding:4px 0">尚未選擇客戶，請從下方勾選</span>
          </div>
          <!-- 客戶清單（可滾動） -->
          <div id="customList" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch"></div>
          <!-- 底部固定按鈕 -->
          <div style="padding:12px 16px;border-top:1px solid var(--bdr);display:flex;gap:10px;flex-shrink:0;background:#fff;padding-bottom:max(12px,env(safe-area-inset-bottom))">
            <button onclick="clearCustom()" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--bdr);background:#fff;font-family:inherit;font-size:14px;color:var(--dim);cursor:pointer">🗑 清除</button>
            <button onclick="runCustomRoute()" style="flex:2;padding:12px;border-radius:10px;border:none;background:var(--acc);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">🗺 產生路線</button>
          </div>
        </div>
      </div>

      <!-- 自訂路線結果 -->
      <div id="customResult" style="margin-bottom:12px"></div>


      <div id="rstats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px"></div>
      <div id="rgrid"></div>
    </div>
  </div>
</div>
<div class="mo" id="modal">
  <div class="md">
    <div class="mh"><h2 id="mtitle">新增客戶</h2><button class="mc" onclick="closeModal()">✕</button></div>
    <div class="mb">
      <div class="fg">
        <div><label class="fl">區域</label><input class="fi2" id="f_region" placeholder="例：鳳山區"></div>
        <div><label class="fl">台數</label><input class="fi2" id="f_count" type="number" min="1"></div>
        <div class="fg-full"><label class="fl">客戶名稱</label><input class="fi2" id="f_name"></div>
        <div class="fg-full"><label class="fl">地址</label><input class="fi2" id="f_addr" placeholder="輸入完整地址"></div>
        <div class="fg-full"><label class="fl">機器型號</label><input class="fi2" id="f_model"></div>
        <div><label class="fl">第一次巡點</label><input class="fi2" id="f_date1" type="date"></div>
        <div><label class="fl">第二次巡點</label><input class="fi2" id="f_date2" type="date"></div>

var db = firebase.database();
var DB_PATH = 'xundian_data';
var fbConnected = false;
var fbRef = null;

function initFirebase() {
  fbRef = db.ref(DB_PATH);

  // 監聽連線狀態
  db.ref('.info/connected').on('value', function(snap) {
    fbConnected = snap.val() === true;
    var ind = document.getElementById('saveindicator');
    if (ind) {
      if (fbConnected) {
        ind.innerHTML = '🟢 已連線同步';
        ind.style.color = '#27ae60';
      } else {
        ind.innerHTML = '🔴 離線中';
        ind.style.color = '#e74c3c';
      }
    }
  });

  // 監聽遠端資料變動，自動同步到本地
  fbRef.on('value', function(snap) {
    var val = snap.val();
    if (val) {
      // 合併遠端資料
      var keys = Object.keys(val);
      for (var i = 0; i < keys.length; i++) {
        if (allData[keys[i]] !== undefined) {
          allData[keys[i]] = val[keys[i]];
        }
      }
      renderNav();
      renderPills();
      renderTable();
    }
  });
}

function saveToFirebase() {
  if (!fbRef) return;
  // 只儲存有實際資料的月份，避免太大
  var toSave = {};
  var keys = Object.keys(allData);
  for (var i = 0; i < keys.length; i++) {
    toSave[keys[i]] = allData[keys[i]];
  }
  fbRef.set(toSave).catch(function(e) {
    console.warn('Firebase 儲存失敗:', e);
  });
}

function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
  } catch(e) {}
  // 同步到 Firebase
  saveToFirebase();
}
function loadFromStorage() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { var saved = JSON.parse(raw); var ks = Object.keys(saved); for (var i=0;i<ks.length;i++) { if (allData[ks[i]]!==undefined) allData[ks[i]]=saved[ks[i]]; } return true; }
  } catch(e) {}
  return false;
}
function clearStorage() {
  if (!confirm('確定要清除所有本機資料嗎？')) return;
  localStorage.removeItem(STORAGE_KEY);
  allData = JSON.parse(JSON.stringify(rawData));
  renderNav(); renderPills(); renderTable(); toast('🗑 已重置');
}

function toggleSB() {
  var sb=document.getElementById('sb'), ovl=document.getElementById('ovl'), tog=document.getElementById('tog');

}
function showView(v) {
  curView = v;
  document.getElementById('recView').style.display = v==='records'?'flex':'none';
  document.getElementById('routeView').style.display = v==='route'?'flex':'none';
  document.getElementById('routeBtn').classList.toggle('on', v==='route');

}
function renderNav() {
  var html='';
  for (var i=0;i<MONTHS.length;i++) {
    var m=MONTHS[i], cnt=allData[m]?allData[m].length:0, on=m===curMonth?' on':'';
    html+='<button class="sb-btn'+on+'" onclick="switchMonth(\''+m+'\')">'+m+'<span class="ct">'+cnt+'</span></button>';
  }
  document.getElementById('mnav').innerHTML=html;
  document.getElementById('routeBtn').classList.toggle('on',curView==='route');
}
function switchMonth(m) {
  curMonth=m; showView('records'); renderNav(); renderPills(); renderTable();
}
function renderPills() {
  var rows=allData[curMonth]||[], done=0, fix=0, total=0;
  for (var i=0;i<rows.length;i++) {
    if (rows[i].status==='已完成') done++;
    if (rows[i].status==='待維修') fix++;
    total+=parseInt(rows[i].count)||0;
  }
  document.getElementById('pills').innerHTML=
    '<div class="pill">客戶 <b>'+rows.length+'</b></div>'+
    '<div class="pill">機器 <b>'+total+'</b></div>'+
    '<div class="pill">完成 <b style="color:#27ae60">'+done+'</b></div>'+
    '<div class="pill">待修 <b style="color:#e74c3c">'+fix+'</b></div>';
}
function renderRegions() {
  var seen={}, ks=Object.keys(allData);
  for (var k=0;k<ks.length;k++) { var rows=allData[ks[k]]; for (var i=0;i<rows.length;i++) { if(rows[i].region) seen[rows[i].region]=1; } }
  var regions=Object.keys(seen).sort(), html='<option value="">全部區域</option>';
  for (var j=0;j<regions.length;j++) html+='<option value="'+regions[j]+'">'+regions[j]+'</option>';
  document.getElementById('rgFil').innerHTML=html;
}
function onSearch(v) { sTerm=v.toLowerCase(); renderTable(); }
function onFilter() { sReg=document.getElementById('rgFil').value; sSt=document.getElementById('stFil').value; renderTable(); }
function doSort(k) { if(sKey===k) sDir*=-1; else{sKey=k;sDir=1;} renderTable(); }
function getRows() {
  var rows=[], src=allData[curMonth]||[];
  for (var i=0;i<src.length;i++) {
    var r=src[i]; r._i=i;
    if (sTerm) { var hay=((r.name||'')+(r.addr||'')+(r.model||'')+(r.region||'')+(r.note||'')).toLowerCase(); if(hay.indexOf(sTerm)<0) continue; }
    if (sReg&&r.region!==sReg) continue;
    if (sSt&&r.status!==sSt) continue;
    rows.push(r);
  }
  if (sKey) rows.sort(function(a,b){ return String(a[sKey]||'').localeCompare(String(b[sKey]||''),'zh-TW')*sDir; });
  return rows;
}
function fmtD(d) {
  if (!d||d==='NaN') return '';
  if (d.indexOf('-')<0) return d;
  var p=d.split('-'); if(p.length<3) return d;
  return parseInt(p[1])+'/'+parseInt(p[2]);
}
function toIDate(d) {
  if (!d) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  if (/^\d{1,2}\/\d{1,2}$/.test(d)) { var p=d.split('/'),y=new Date().getFullYear(); return y+'-'+p[0].padStart(2,'0')+'-'+p[1].padStart(2,'0'); }
  return '';
}
function stBadge(s) {
  if (s==='已完成') return '<span class="bds bd-ok">✓ 已完成</span>';
  if (s==='待維修') return '<span class="bds bd-fix">🔧 待維修</span>';
  if (s==='未完成') return '<span class="bds bd-pend">⚠ 未完成</span>';
  return '<span class="bds bd-nil">—</span>';
}
function mkDateCell(origIdx, field, val) {
  var display = val
    ? '<span class="mn" style="color:#1a1d2e;font-weight:700">'+fmtD(val)+'</span>'
    : '<span class="dph">點擊設定</span>';
  return '<td class="dc" style="position:relative;min-width:72px">' +
    '<div class="dd" style="pointer-events:none">'+display+'</div>' +
    '<input type="date" class="id-native" value="'+toIDate(val)+'" data-idx="'+origIdx+'" data-field="'+field+'"' +
    ' onchange="saveDate(this)"' +
    ' oninput="saveDate(this)"' +
    ' onblur="saveDateIfChanged(this)">' +
    '</td>';
}
// openDate / closeDate 不再需要（改用 native input overlay 方案）
function openDate(td) {}
function closeDate(inp) {}
function saveDate(inp) {
  var idx=parseInt(inp.getAttribute('data-idx')), field=inp.getAttribute('data-field');
  var newVal = inp.value || '';
  // 避免重複儲存相同值
  if (allData[curMonth][idx][field] === newVal) return;
  allData[curMonth][idx][field] = newVal;
  saveToStorage();
  if (newVal) toast('📅 ' + fmtD(newVal) + ' 已儲存');
  else toast('🗑 日期已清除');
  renderTable();
  renderPills();
}

// onblur 時也檢查一次，處理 Safari 重置按鈕
function saveDateIfChanged(inp) {
  var idx=parseInt(inp.getAttribute('data-idx')), field=inp.getAttribute('data-field');
  var newVal = inp.value || '';
  var curVal = allData[curMonth][idx][field] || '';
  if (newVal !== curVal) {
    allData[curMonth][idx][field] = newVal;
    saveToStorage();
    if (newVal) toast('📅 ' + fmtD(newVal) + ' 已儲存');
    else toast('🗑 日期已清除');
    renderTable();
    renderPills();
  }
}
function cycleStatus(idx) {
  var order=['','已完成','待維修','未完成'];
  var cur=allData[curMonth][idx].status||'';
  var next=order[(order.indexOf(cur)+1)%order.length];
  allData[curMonth][idx].status=next;
  var labels={'已完成':'✅ 已完成','待維修':'🔧 待維修','未完成':'⚠ 未完成','':'— 未設定'};
  saveToStorage(); toast(labels[next]||'— 未設定'); renderTable(); renderPills();
}
function renderTable() {
  var rows=getRows(), tbody=document.getElementById('tbody'), empty=document.getElementById('empty');
  if (!rows.length) { tbody.innerHTML=''; empty.style.display='block'; renderPills(); return; }
  empty.style.display='none';
  var html='';
  for (var i=0;i<rows.length;i++) {
    var r=rows[i];
    var nameLink = r.addr
      ? '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((r.name||'')+' '+(r.addr||''))+'" target="_blank" rel="noopener" style="color:var(--txt);text-decoration:none" onmouseover="this.style.color=\'var(--acc)\'" onmouseout="this.style.color=\'var(--txt)\'">'+(r.name||'')+'</a>'
      : (r.name||'');
    var addrLink = r.addr
      ? '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.addr)+'" target="_blank" rel="noopener" style="font-size:11px;color:var(--dim);text-decoration:none" onmouseover="this.style.color=\'var(--acc2)\'" onmouseout="this.style.color=\'var(--dim)\'">📍 '+r.addr+'</a>'
      : '';
    html+='<tr>';
    html+='<td class="c0 mn" style="color:var(--dim)">'+(i+1)+'</td>';
    html+='<td class="c1"><span style="font-size:11px;color:var(--acc2)">'+(r.region||'')+'</span></td>';
    var addrSmall = r.addr ? '<div style="font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">'+r.addr+'</div>' : '';
    html+='<td class="c2"><div class="trunc">'+nameLink+'</div>'+addrSmall+'</td>';

    html+='<td class="c4" style="font-weight:700;color:'+((r.count||0)>=5?'var(--warn)':'var(--txt)')+'">'+( r.count||'—')+'</td>';
    html+='<td class="c5"><div class="trunc mn">'+(r.model||'')+'</div></td>';
    html+='<td class="c12"><div class="abtns"><button class="ib" onclick="openEdit('+r._i+')" title="編輯">✏️</button><button class="ib del" onclick="delRec('+r._i+')" title="刪除">🗑</button></div></td>';
    html+=mkDateCell(r._i,'date1',r.date1);
    html+=mkDateCell(r._i,'date2',r.date2);

// ── 路線規劃 ──
var rDays=null, rTab='all';
function rdist(a,b,c,d){ var R=6371,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)*Math.sin(dG/2); return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
function radd(t,m){ var p=t.split(':'),h=parseInt(p[0]),mn=parseInt(p[1]),tot=h*60+mn+m; return String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0'); }
function rmaps(a){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a); }
function rroute(stops){
  var HOME = curLoc.isCustom
    ? curLoc.lat + ',' + curLoc.lng
    : '高雄市左營區博愛三路520號3樓';
  var pts=[HOME];
  var max=Math.min(stops.length,5);
  for(var i=0;i<max;i++) pts.push(stops[i].a);
  return 'https://www.google.com/maps/dir/'+pts.map(function(p){ return encodeURIComponent(p); }).join('/');
}
// ── 定位功能 ──
var curLoc = {
  lat: 22.696,
  lng: 120.3024,
  label: '左營博愛三路520號（預設）',
  isCustom: false
};

function locateMe() {
  var btn = document.getElementById('locateBtn');
  var txt = document.getElementById('locationText');
  if (!navigator.geolocation) {
    toast('您的裝置不支援定位功能', true);
    return;
  }
  btn.textContent = '⏳ 定位中…';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      curLoc.lat = pos.coords.latitude;
      curLoc.lng = pos.coords.longitude;
      curLoc.isCustom = true;
      curLoc.label = '目前位置（' + curLoc.lat.toFixed(4) + ', ' + curLoc.lng.toFixed(4) + '）';
      txt.innerHTML = '📍 出發：<strong style="color:var(--acc)">目前位置 ✓</strong>';
      btn.textContent = '🔄 重新定位';
      btn.disabled = false;
      // 重新計算路線
      rDays = null;
      renderRoute();
      toast('✅ 已定位！路線已重新計算');
    },
    function(err) {
      btn.textContent = '🎯 定位我的位置';
      btn.disabled = false;
      var msg = '定位失敗';
      if (err.code === 1) msg = '請允許瀏覽器存取位置';
      if (err.code === 2) msg = '無法取得位置，請確認 GPS 開啟';
      if (err.code === 3) msg = '定位逾時，請再試一次';
      toast(msg, true);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

function resetLocation() {
  curLoc = { lat: 22.696, lng: 120.3024, label: '左營博愛三路520號（預設）', isCustom: false };
  document.getElementById('locationText').innerHTML = '📍 出發：左營博愛三路520號（預設）';
  document.getElementById('locateBtn').textContent = '🎯 定位我的位置';
  rDays = null;
  renderRoute();
}

function buildDays(){
  var HL=curLoc.lat,HG=curLoc.lng;
  var sorted=ROUTE_CLIENTS.slice().sort(function(a,b){ return rdist(HL,HG,b.lat,b.lng)-rdist(HL,HG,a.lat,a.lng); });
  var days=[],used={};
  while(true){
    var pool=[];
    for(var i=0;i<sorted.length;i++){ if(!used[i]) pool.push({c:sorted[i],i:i}); }
    if(!pool.length) break;
    var anchor=pool[0].c; used[pool[0].i]=1;
    var group=[anchor],budget=210-40;
    var near=[];
    for(var j=1;j<pool.length;j++) near.push({c:pool[j].c,i:pool[j].i,d:rdist(anchor.lat,anchor.lng,pool[j].c.lat,pool[j].c.lng)});
    near.sort(function(a,b){return a.d-b.d;});
    for(var k=0;k<near.length;k++){ if(group.length>=5||budget<40) break; group.push(near[k].c); used[near[k].i]=1; budget-=40; }
    var t='09:00',stops=[];
    for(var s=0;s<group.length;s++){ var arrive=t; t=radd(t,40); var obj={}; for(var key in group[s]) obj[key]=group[s][key]; obj.arrive=arrive; obj.leave=t; stops.push(obj); }
    days.push({stops:stops,pal:RPAL[days.length%RPAL.length]});
  }
  return days;
}
function setRTab(t){ rTab=t; renderRoute(); }
function toggleRDay(btn){ var body=btn.nextElementSibling,chv=btn.querySelector('.rchv'),open=body.classList.toggle('op'); chv.style.transform=open?'rotate(90deg)':''; }
function renderRoute(){
  if(!rDays) rDays=buildDays();
  var shown=rTab==='all'?rDays:[rDays[parseInt(rTab)]];
  document.getElementById('rstats').innerHTML=
    '<div class="rstat"><div class="rsl2">客戶總數</div><div class="rsv">'+ROUTE_CLIENTS.length+'</div></div>'+
    '<div class="rstat"><div class="rsl2">規劃天數</div><div class="rsv">'+rDays.length+'</div></div>'+
    '<div class="rstat"><div class="rsl2">工作時間</div><div class="rsv" style="font-size:12px;padding-top:4px">09:00–12:30</div></div>'+
    '<div class="rstat"><div class="rsl2">出發地</div><div class="rsv" style="font-size:11px;padding-top:4px">左營博愛三路</div></div>';
  var tabsHtml='<button class="rtb '+(rTab==='all'?'on':'')+'" onclick="setRTab(\'all\')">全部 '+rDays.length+' 天</button>';
  for(var i=0;i<rDays.length;i++) tabsHtml+='<button class="rtb '+(rTab==i?'on':'')+'" onclick="setRTab('+i+')">D'+(i+1)+'·'+rDays[i].stops[0].r.replace('區','').replace('縣','')+'</button>';
  document.getElementById('rtabs').innerHTML=tabsHtml;
  var gridHtml='';
  for(var si=0;si<shown.length;si++){
    var day=shown[si],di=rTab==='all'?si:parseInt(rTab),pal=day.pal;
    var regions=[];
    for(var ri=0;ri<day.stops.length;ri++){ if(regions.indexOf(day.stops[ri].r)<0) regions.push(day.stops[ri].r); }
    var url=rroute(day.stops);
    var stopsHtml='';
    for(var st=0;st<day.stops.length;st++){
      var sp=day.stops[st];
      stopsHtml+='<div class="rsp">'+
        '<div class="rsl"><div class="rdt" style="background:'+pal.dot+'"></div><div class="rvl"></div></div>'+
        '<div class="rsb"><div class="rsn">'+sp.n+'</div><div class="rsa">'+sp.a+'</div>'+
        '<div class="rsm"><span class="rbg rbg-r">'+sp.r+'</span><span class="rbg rbg-m">'+sp.m+'</span><span class="rbg rbg-t">'+sp.arrive+' 抵達</span></div></div>'+
        '<a class="rma" href="'+rmaps(sp.a)+'" target="_blank" rel="noopener">地圖</a>'+
      '</div>';
    }
    gridHtml+='<div class="rcard">'+
      '<div class="rh" onclick="toggleRDay(this)">'+
        '<div class="rci" style="background:'+pal.bg+';color:'+pal.txt+'">D'+(di+1)+'</div>'+
        '<div class="ri"><div class="rt">'+regions.join('、')+' — '+day.stops.length+' 個停點</div><div class="rs">09:00 出發 · 約 '+day.stops[day.stops.length-1].leave+' 結束</div></div>'+
        '<a class="rnb" href="'+url+'" target="_blank" rel="noopener">導航全程</a>'+
        '<span class="rchv">›</span>'+
      '</div>'+
      '<div class="rb">'+
        '<div class="rhs"><div class="rhd"></div>出發：'+(curLoc.isCustom?'目前位置':'高雄市左營區博愛三路520號3樓')+'（09:00）</div>'+
        stopsHtml+
      '</div>'+
    '</div>';
  }
  document.getElementById('rgrid').innerHTML=gridHtml;
}


// ── 自訂行程 ──
var custSelected = {}; // {id: clientObj}

function showCustomPlanner() {
  document.getElementById('customPanel').style.display = 'block';
  document.getElementById('custSearch').value = '';
  renderCustomList('');
  renderSelectedChips();
}
function hideCustomPlanner() {
  document.getElementById('customPanel').style.display = 'none';
}

function getAllClients() {
  // 從當前月份的 allData 取得有地理座標的客戶（用 ROUTE_CLIENTS 的座標）
  // 合併當月資料 + ROUTE_CLIENTS 座標
  var month = allData[curMonth] || [];
  var result = [];
  for (var i = 0; i < month.length; i++) {
    var r = month[i];
    if (!r.name || !r.addr) continue;
    // 找對應的座標
    var coords = null;
    for (var j = 0; j < ROUTE_CLIENTS.length; j++) {
      if (ROUTE_CLIENTS[j].n === r.name || ROUTE_CLIENTS[j].a === r.addr) {
        coords = {lat: ROUTE_CLIENTS[j].lat, lng: ROUTE_CLIENTS[j].lng};
        break;
      }
    }
    result.push({
      id: r.name + '_' + i,
      name: r.name,
      addr: r.addr,
      region: r.region || '',
      model: r.model || '',
      lat: coords ? coords.lat : null,
      lng: coords ? coords.lng : null
    });
  }
  return result;
}

function renderCustomList(search) {
  var clients = getAllClients();
  var q = (search || '').toLowerCase();
  if (q) clients = clients.filter(function(c) {
    return c.name.toLowerCase().indexOf(q) >= 0 || c.region.toLowerCase().indexOf(q) >= 0 || c.addr.toLowerCase().indexOf(q) >= 0;
  });
  var html = '';
  if (!clients.length) {
    html = '<div style="padding:20px;text-align:center;color:var(--dim);font-size:13px">查無客戶</div>';
  } else {
    for (var i = 0; i < clients.length; i++) {
      var cl = clients[i];
      var sel = custSelected[cl.id] ? ' selected' : '';
      var chk = custSelected[cl.id] ? '✓' : '';
      html += '<div class="cust-item' + sel + '" onclick="toggleCust(\'' + cl.id.replace(/'/g, "\\'") + '\')" data-id="' + cl.id.replace(/"/g, '&quot;') + '">' +
        '<div class="cust-cb">' + chk + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + cl.name + '</div>' +
          '<div style="font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + cl.addr + '</div>' +
        '</div>' +
        '<span class="cust-tag">' + cl.region + '</span>' +
      '</div>';
    }
  }
  document.getElementById('customList').innerHTML = html;
}

function toggleCust(id) {
  var clients = getAllClients();
  var found = null;
  for (var i = 0; i < clients.length; i++) {
    if (clients[i].id === id) { found = clients[i]; break; }
  }
  if (!found) return;
  if (custSelected[id]) {
    delete custSelected[id];
  } else {
    custSelected[id] = found;
  }
  renderCustomList(document.getElementById('custSearch').value);
  renderSelectedChips();
  var cnt = Object.keys(custSelected).length;
  var el = document.getElementById('custCount');
  if (el) el.textContent = cnt ? '已選 '+cnt+' 個' : '';
}

function renderSelectedChips() {
  var keys = Object.keys(custSelected);
  var el = document.getElementById('selectedList');
  var emptyEl = document.getElementById('selectedEmpty');
  if (!keys.length) {
    el.innerHTML = '<span id="selectedEmpty" style="font-size:12px;color:var(--dim);padding:4px 0">尚未選擇客戶</span>';
    return;
  }
  var html = '';
  for (var i = 0; i < keys.length; i++) {
    var cl = custSelected[keys[i]];
    html += '<span class="sel-chip" onclick="toggleCust(\'' + keys[i].replace(/'/g, "\\'") + '\')" title="點擊移除">' + cl.name + ' ✕</span>';
  }
  el.innerHTML = html;
}

function clearCustom() {
  custSelected = {};
  renderCustomList(document.getElementById('custSearch').value);
  renderSelectedChips();
  document.getElementById('customResult').innerHTML = '';
  var el = document.getElementById('custCount');
  if (el) el.textContent = '';
}

function runCustomRoute() {
  var keys = Object.keys(custSelected);
  if (!keys.length) { toast('請先勾選客戶', true); return; }

  var HOME_LAT = curLoc.lat, HOME_LNG = curLoc.lng;
  var HOME = curLoc.isCustom ? (curLoc.lat+','+curLoc.lng) : '高雄市左營區博愛三路520號3樓';

  // 收集有座標的客戶，用最近鄰演算法排序
  var withCoords = [], noCoords = [];
  for (var i = 0; i < keys.length; i++) {
    var cl = custSelected[keys[i]];
    if (cl.lat && cl.lng) withCoords.push(cl);
    else noCoords.push(cl);
  }

  // 最近鄰排序（從住家出發，每次找最近的下一個）
  var sorted = [];
  var curLat = HOME_LAT, curLng = HOME_LNG;
  var remaining = withCoords.slice();
  while (remaining.length) {
    var bestIdx = 0, bestDist = Infinity;
    for (var j = 0; j < remaining.length; j++) {
      var d = rdist(curLat, curLng, remaining[j].lat, remaining[j].lng);
      if (d < bestDist) { bestDist = d; bestIdx = j; }
    }
    sorted.push(remaining[bestIdx]);
    curLat = remaining[bestIdx].lat;
    curLng = remaining[bestIdx].lng;
    remaining.splice(bestIdx, 1);
  }
  // 沒座標的排最後
  for (var k = 0; k < noCoords.length; k++) sorted.push(noCoords[k]);

  // 產生路線 HTML
  var pal = {bg:'rgba(255,159,67,.15)',txt:'#b37400',dot:'#ff9f43'};
  var url = 'https://www.google.com/maps/dir/'+[HOME].concat(sorted.map(function(s){return s.addr;})).slice(0,6).map(function(p){return encodeURIComponent(p);}).join('/');

  var stopsHtml = '';
  for (var si = 0; si < sorted.length; si++) {
    var sp = sorted[si];
    var arrMins = 40 * (si + 1);
    var arr = radd('09:00', arrMins);
    stopsHtml += '<div class="rsp">' +
      '<div class="rsl"><div class="rdt" style="background:'+pal.dot+'"></div><div class="rvl"></div></div>' +
      '<div class="rsb">' +
        '<div class="rsn">' + sp.name + '</div>' +
        '<div class="rsa">' + sp.addr + '</div>' +
        '<div class="rsm"><span class="rbg rbg-r">' + sp.region + '</span>' + (sp.lat ? '' : '<span class="rbg" style="background:rgba(255,77,109,.1);color:var(--err)">需確認地址</span>') + '<span class="rbg rbg-t">' + arr + ' 抵達</span></div>' +
      '</div>' +
      '<a class="rma" href="' + rmaps(sp.addr) + '" target="_blank" rel="noopener">地圖</a>' +
    '</div>';
  }

  var today = new Date();
  var dateStr = (today.getMonth()+1) + '/' + today.getDate();

  document.getElementById('customResult').innerHTML =
    '<div class="rcard">' +
      '<div class="rh" onclick="toggleRDay(this)">' +
        '<div class="rci" style="background:'+pal.bg+';color:'+pal.txt+'">今日</div>' +
        '<div class="ri"><div class="rt">自訂行程 ' + dateStr + ' — ' + sorted.length + ' 個停點</div><div class="rs">09:00 出發 · 依最近距離排序</div></div>' +
        '<a class="rnb" href="' + url + '" target="_blank" rel="noopener">導航全程</a>' +
        '<span class="rchv">›</span>' +
      '</div>' +
      '<div class="rb op">' +
        '<div class="rhs"><div class="rhd"></div>出發：高雄市左營區博愛三路520號3樓（09:00）</div>' +
        stopsHtml +
      '</div>' +
    '</div>';

  toast('✅ 路線已產生，共 ' + sorted.length + ' 個停點');
  // 關閉面板，讓使用者看到結果
  hideCustomPlanner();
  // 捲動到結果
  setTimeout(function(){
    var el = document.getElementById('customResult');
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 300);
}
